name: SUBRIMA Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build SUBRIMA APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;26.1.10909125"

      - name: Check environment
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --list_installed | grep -E 'platforms;android-35|build-tools;35.0.0|cmake;3.22.1|ndk;26.1.10909125' || true

      - name: Make Gradle executable
        run: chmod +x ./SubtitlesAppSubrimaProject/gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check Gradle
        working-directory: ./SubtitlesAppSubrimaProject
        run: ./gradlew --version

      - name: Build SUBRIMA debug APK
        working-directory: ./SubtitlesAppSubrimaProject
        run: |
          ./gradlew clean assembleDebug \
            --stacktrace \
            --no-daemon \
            --console=plain

      - name: Find APK
        run: |
          find ./SubtitlesAppSubrimaProject \
            -type f \
            -name "*.apk" \
            -print

      - name: Rename APK
        run: |
          mkdir -p ./release
          APK="$(find ./SubtitlesAppSubrimaProject -type f -path "*/build/outputs/apk/debug/*.apk" | head -n 1)"
          test -n "$APK"
          cp "$APK" ./release/SUBRIMA-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SUBRIMA-debug
          path: release/SUBRIMA-debug.apk
          if-no-files-found: error
          retention-days: 30
