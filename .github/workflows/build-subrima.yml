name: SUBRIMA Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build SUBRIMA APK
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. Получаем исходный код
      # ---------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Java 17
      # ---------------------------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ---------------------------------------------------------
      # 3. Определяем Android SDK
      # ---------------------------------------------------------
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ -z "$ANDROID_HOME" ]; then
            export ANDROID_HOME="$HOME/android-sdk"
            export ANDROID_SDK_ROOT="$ANDROID_HOME"
            echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          fi

      # ---------------------------------------------------------
      # 4. Находим sdkmanager
      # ---------------------------------------------------------
      - name: Locate sdkmanager
        run: |
          echo "Searching for sdkmanager..."

          find "$ANDROID_HOME" \
            -type f \
            -name sdkmanager \
            -print 2>/dev/null || true

          SDKMANAGER=""

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$ANDROID_HOME" \
              -type f \
              -name sdkmanager \
              -perm -111 \
              2>/dev/null | head -n 1)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # 5. Android SDK packages
      # ---------------------------------------------------------
      - name: Set up Android SDK packages
        run: |
          echo "Using:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;26.1.10909125"

      # ---------------------------------------------------------
      # 6. Проверяем Android SDK
      # ---------------------------------------------------------
      - name: Check Android SDK
        run: |
          echo "========================================"
          echo "ANDROID SDK"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "SDKMANAGER=$SDKMANAGER"

          "$SDKMANAGER" --list_installed || true

          echo ""
          echo "========================================"
          echo "SDK DIRECTORIES"
          echo "========================================"

          ls -la "$ANDROID_HOME" || true
          ls -la "$ANDROID_HOME/platforms" || true
          ls -la "$ANDROID_HOME/build-tools" || true
          ls -la "$ANDROID_HOME/cmake" || true
          ls -la "$ANDROID_HOME/ndk" || true

      # ---------------------------------------------------------
      # 7. Проверяем проект
      # ---------------------------------------------------------
      - name: Check project
        run: |
          echo "========================================"
          echo "PROJECT ROOT"
          echo "========================================"

          ls -la

          echo ""
          echo "========================================"
          echo "SUBRIMA PROJECT"
          echo "========================================"

          ls -la ./SubtitlesAppSubrimaProject

      # ---------------------------------------------------------
      # 8. Gradle Wrapper
      # ---------------------------------------------------------
      - name: Check Gradle Wrapper
        working-directory: ./SubtitlesAppSubrimaProject
        run: |
          echo "========================================"
          echo "GRADLE WRAPPER"
          echo "========================================"

          ls -la

          echo ""
          echo "gradlew:"
          ls -la ./gradlew

          echo ""
          echo "gradle directory:"
          ls -la ./gradle || true

          echo ""
          echo "wrapper directory:"
          ls -la ./gradle/wrapper || true

      # ---------------------------------------------------------
      # 9. Делаем gradlew исполняемым
      # ---------------------------------------------------------
      - name: Make Gradle executable
        run: |
          chmod +x ./SubtitlesAppSubrimaProject/gradlew

          ls -la ./SubtitlesAppSubrimaProject/gradlew

      # ---------------------------------------------------------
      # 10. Настраиваем Gradle
      # ---------------------------------------------------------
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: false

      # ---------------------------------------------------------
      # 11. Проверяем Gradle
      # ---------------------------------------------------------
      - name: Check Gradle
        working-directory: ./SubtitlesAppSubrimaProject
        run: |
          ./gradlew --version

      # ---------------------------------------------------------
      # 12. Проверяем Android Gradle Plugin
      # ---------------------------------------------------------
      - name: Check Android environment
        working-directory: ./SubtitlesAppSubrimaProject
        run: |
          echo "========================================"
          echo "JAVA"
          echo "========================================"

          java -version

          echo ""
          echo "========================================"
          echo "ANDROID"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "========================================"
          echo "GRADLE"
          echo "========================================"

          ./gradlew --version

      # ---------------------------------------------------------
      # 13. Очистка проекта
      # ---------------------------------------------------------
      - name: Clean project
        working-directory: ./SubtitlesAppSubrimaProject
        run: |
          ./gradlew clean \
            --stacktrace \
            --no-daemon \
            --console=plain

      # ---------------------------------------------------------
      # 14. Сборка SUBRIMA DEBUG APK
      # ---------------------------------------------------------
      - name: Build SUBRIMA debug APK
        working-directory: ./SubtitlesAppSubrimaProject
        run: |
          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon \
            --console=plain

      # ---------------------------------------------------------
      # 15. Ищем APK
      # ---------------------------------------------------------
      - name: Find APK
        run: |
          echo "========================================"
          echo "APK FILES"
          echo "========================================"

          find ./SubtitlesAppSubrimaProject \
            -type f \
            -name "*.apk" \
            -print

      # ---------------------------------------------------------
      # 16. Проверяем, что APK действительно создан
      # ---------------------------------------------------------
      - name: Verify APK
        run: |
          APK="$(find ./SubtitlesAppSubrimaProject \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: SUBRIMA debug APK was not created"
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          ls -lh "$APK"

      # ---------------------------------------------------------
      # 17. Переименовываем APK
      # ---------------------------------------------------------
      - name: Prepare SUBRIMA-debug.apk
        run: |
          mkdir -p ./release

          APK="$(find ./SubtitlesAppSubrimaProject \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)"

          test -n "$APK"

          cp "$APK" ./release/SUBRIMA-debug.apk

          echo "========================================"
          echo "FINAL APK"
          echo "========================================"

          ls -lh ./release/SUBRIMA-debug.apk

      # ---------------------------------------------------------
      # 18. Загружаем APK как GitHub Artifact
      # ---------------------------------------------------------
      - name: Upload SUBRIMA-debug.apk
        uses: actions/upload-artifact@v4
        with:
          name: SUBRIMA-debug
          path: release/SUBRIMA-debug.apk
          if-no-files-found: error
          retention-days: 30
