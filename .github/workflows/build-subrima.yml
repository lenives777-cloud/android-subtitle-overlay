name: SUBRIMA Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Check Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          java -version
          adb version || true
          ls -la "$ANDROID_HOME" || true

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build SUBRIMA debug APK
        run: ./gradlew clean assembleDebug --stacktrace --no-daemon --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SUBRIMA-debug
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
